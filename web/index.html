<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polaris</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cg transform='translate(3.2 3.2) scale(.8)' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M9.42 18.39A7 7 0 0 1 22.06 12.5'/%3E%3Cpath d='M27.75 20.28A12.5 12.5 0 1 1 11.72 4.25'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23fff' stroke='none'/%3E%3C/g%3E%3C/svg%3E" />
    <script>
      // Apply the last known appearance before first paint (no flash): a copy of the user's saved preferences.
      // No saved mode = follow the OS; no palette = the default.
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        const p = localStorage.getItem("palette");
        if (p) document.documentElement.dataset.palette = p;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
