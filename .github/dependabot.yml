# Weekly version updates, grouped so they arrive as one PR per ecosystem. Security updates are separate and immediate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The sandbox base image is pinned by digest; this proposes the new digest (and bump IMAGE_VERSION in server/sandbox.ts).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
